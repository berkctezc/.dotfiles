[include]
# paths = ["/etc/topgrade.toml"]

[misc]
sudo_command = "sudo"
disable = []
ignore_failures = [
    "vim",
]
set_title = true
display_time = true
assume_yes = true
no_retry = true
cleanup = true
notify_each_step = false
pre_sudo = true
ask_retry = false
auto_retry = 1
sudo_loop = true
sudo_loop_interval = 240
allow_root = false
notify_end = "on_failure"
show_skipped = true
no_self_update = true
run_in_tmux = false
first = []
last = []
remote_topgrades = []
remote_topgrade_path = ".cargo/bin/topgrade"
bashit_branch = "stable"
show_distribution_summary = true
nix_handler = "autodetect"

# Arguments to pass to SSH when upgrading remote systems
# ssh_arguments = "-o ConnectTimeout=2"
# Changes the way topgrade interacts with
# the tmux session, creating the session
# and only attaching to it if not inside tmux
# (default: "attach_if_not_in_session", allowed values: "attach_if_not_in_session", "attach_always")
# tmux_session_mode = "attach_if_not_in_session"
# Run specific steps - same options as the command line flag
# only = ["system", "emacs"]
# Extra tracing filter directives
# These are prepended to the `--log-filter` argument
# See: https://docs.rs/tracing-subscriber/latest/tracing_subscriber/filter/struct.EnvFilter.html#directives
# log_filters = ["topgrade::command=debug", "warn"]

[brew]
greedy_cask = true
autoremove = true
greedy_latest = true
greedy_auto_updates = true
fetch_head = true

[mandb]
enable = false

[pkgfile]
enable = false

[git]
max_concurrency = 5
fallback_to_fetch_default = true
# Additional git repositories to pull or fetch
# repos = [
#     "~/src/*/",
#     "~/.config/something"
# ]
# Set to `false` to skip pulling/fetching the predefined git repos
# pull_predefined = false
# Arguments to pass Git when pulling/fetching Repositories
# arguments = "--rebase --autostash"
# Whether to perform a `git fetch` instead of `git pull`
# fetch_only = false

[npm]
use_sudo = true

[yarn]
use_sudo = true

[deno]
version = "stable"
no_delta = true

[viteplus]
use_sudo = true

[vim]
force_plug_update = true
vim_pack_prune = true

[firmware]
upgrade = true

[flutter]
force = false

[vagrant]
directories = []
power_on = true
always_suspend = true

[flatpak]
use_sudo = true

[doom]
aot = true

[cargo]
quiet = false
git = true
locked = false

[rustup]
channels = ["stable"]

[vscode]
profile = ""
cleanup_obsolete_extensions = true

[composer]
self_update = true

[sheldon]
quiet = false
verbose = true

[chezmoi]
exclude_encrypted = false

[distrobox]
use_root = false
containers = []

[containers]
runtime = "docker"
system_prune = true
use_sudo = false

[uv]
cache_force = false

[mise]
bump = false
jobs = 8
interactive = false
quiet = false
silent = false
verbose = false

[pixi]
include_release_notes = false

[go]
gup_exclude = []

# Commands to run before anything
[pre_commands]
# "Emacs Snapshot" = "rm -rf ~/.emacs.d/elpa.bak && cp -rl ~/.emacs.d/elpa ~/.emacs.d/elpa.bak"

# Commands to run after anything
[post_commands]
# "Emacs Snapshot" = "rm -rf ~/.emacs.d/elpa.bak && cp -rl ~/.emacs.d/elpa ~/.emacs.d/elpa.bak"

# Custom commands
[commands]
# "Python Environment" = "~/dev/.env/bin/pip install -i https://pypi.python.org/simple -U --upgrade-strategy eager jupyter"
# "Custom command using interactive shell (unix)" = "-i vim_upgrade"

[python]
enable_pip_review = false
enable_pipupgrade = false
# enable_pip_review_local = true                   ###disabled by default
# pipupgrade_arguments = "-y -u --pip-path pip"    ###disabled by default

# For the poetry step, by default, Topgrade skips its update if poetry is not
# installed with the official script. This configuration entry forces Topgrade
# to run the update in this case.
#
# (default: false)
# poetry_force_self_update = true

[conda]
# Additional named conda environments to update (`conda env update -n env_name`)
# env_names = [
#     "Toolbox",
#     "PyTorch"
# ]
# Additional conda environment paths to update (`conda env update -p env_path`)
# env_paths = [
#     "~/webserver/.conda/",
#     "~/experiments/.conda/"
# ]

[lensfun]
# If disabled, Topgrade invokes `lensfun-update-data` without root privilege,
# then the update will be only available to you. Otherwise, `sudo` is required,
# and the update will be installed system-wide, i.e., available to all users.
# (default: false)
# use_sudo = false

[julia]
# If disabled, Topgrade invokes julia with the --startup-file=no CLI option.
#
# This may be desirable to avoid loading outdated packages with "using" directives
# in the startup file, which might cause the update run to fail.
# (default: true)
# startup_file = true

[zigup]
cleanup = true
target_versions = ["master"]

# Specifies the directory that the zig files will be installed to.
# If defined, passed with the --install-dir command line flag.
# If not defined, zigup will use its default behaviour.
# (default: not defined)
# install_dir = "~/.zig"

# Specifies the path of the symlink which will be set to point at the default compiler version.
# If defined, passed with the --path-link command line flag.
# If not defined, zigup will use its default behaviour.
# This is not meaningful if set_default is not enabled.
# (default: not defined)
# path_link = "~/.bin/zig"

[skills]
# Package runner to use to run the `skills` CLI when no local `skills`
# binary is present in PATH.
# Allowed values:
#   npm  (runs `npx skills`)
#   pnpm (runs `pnpx skills`)
#   bun  (runs `bunx skills`)
#   yarn (runs `yarn dlx skills`)
# (default: npm)
# package_manager = "npm"

[linux]
show_arch_news = true
arch_package_manager = "autodetect"
yay_arguments = "--nodevel"
wsl_use_windows_path = false

# Arguments to pass yay (or paru) when updating packages
# Arguments to pass dnf when updating packages
# dnf_arguments = "--refresh"
# Arguments to pass apt when updating packages
# apt_arguments = "-o Dpkg::Progress-Fancy=1"
# aura_aur_arguments = "-kx"
# aura_pacman_arguments = ""
# garuda_update_arguments = ""
# trizen_arguments = "--devel"
# pikaur_arguments = ""
# pamac_arguments = "--no-devel"
# shelly_arguments = ""
# enable_tlmgr = true
# emerge_sync_flags = "-q"
# emerge_update_flags = "-uDNa --with-bdeps=y world"
# redhat_distro_sync = false
# suse_dup = false
# rpm_ostree = false
# If `bootc` is available and this configuration entry is set to true,
# use it to do the update
# Will also supersede distribution package managers and rpm-ostree if enabled
# (default: false)
# bootc = false
# nix_arguments = "--flake"
# nix_env_arguments = "--prebuilt-only"
# Extra Home Manager arguments
# home_manager_arguments = ["--flake", "file"]

[windows]
self_rename = true
accept_all_updates = true
updates_auto_reboot = "ask"
winget_use_sudo = false
winget_silent_install = true
# open_remotes_in_new_terminal = true
# wsl_update_pre_release = true
# wsl_update_use_web_download = true
