name: 'homelab-container'

x-common-env: &common-env
  PUID: 1000
  PGID: 1000
  TZ: Etc/UTC

services:
#############
# Portainer #
#############
  portainer-ce:
    container_name: portainer
    network_mode: bridge
    image: portainer/portainer-ce:sts
    command: -H tcp://agent:9443 --tlsskipverify
    environment:
      <<: *common-env
    ports:
      - "8000:8000"
      - "9443:9443"
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.config/portainer_data:/data
    privileged: true
  agent:
    container_name: portainer_agent
    image: portainer/agent:sts
    network_mode: bridge
    ports:
      - "9001:9001"
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
############
# Jellyfin #
############
  jellyfin:
    container_name: jellyfin
    image: jellyfin/jellyfin:unstable
    network_mode: bridge
    ports:
      - "8096:8096"
      - "8920:8920"
      - "7359:7359/udp"
      - "1900:1900/udp"
    environment:
      <<: *common-env
    volumes:
      - ~/:/data
      - /mnt:/mnt:rw
      - /dev/shm:/transcode:rw
      - ~/.config/jellyfin:/config
      - ~/.cache/jellyfin:/cache
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    devices:
      - /dev/dri:/dev/dri
################
# Transmission #
################
  transmission:
    container_name: transmission
    image: linuxserver/transmission:latest
    environment:
      <<: *common-env
    volumes:
      - /mnt/storage/transmission/config:/config
      - /mnt/storage/:/storage/
      - /mnt/storage/Downloads:/downloads
    ports:
      - 9091:9091
      - 51413:51413
      - 51413:51413/udp
    restart: unless-stopped
#############
# Syncthing #
#############
  syncthing:
    container_name: syncthing-server
    image: syncthing/syncthing:edge
    hostname: synct-server
    network_mode: host
    environment:
      <<: *common-env
    volumes:
      - /mnt/storage/Syncthing:/var/syncthing
    restart: unless-stopped
    #ports:
    #  - "8384:8384"
    #  - "22000:22000/tcp"
    #  - "22000:22000/udp"
    #  - "21027:21027/udp"
  discovery-server:
    image: syncthing/discosrv:edge
    container_name: syncthing-discovery
    network_mode: host
    environment:
      <<: *common-env
    volumes:
      - ./discosrv-data:/var/stdiscosrv
    restart: unless-stopped
    command:
      - "--listen=:8443"
  relay-server:
    image: syncthing/relaysrv:edge
    container_name: syncthing-relay
    network_mode: host
    environment:
      <<: *common-env
    volumes:
      - ./relaysrv-data:/var/strelaysrv
    restart: unless-stopped
    entrypoint:
      - "/bin/entrypoint.sh"
      - "/bin/strelaysrv"
      - "--pools="
##############
# Watchtower #
##############
  watchtower:
    network_mode: bridge
    image: nickfedor/watchtower:nightly
    container_name: watchtower
    restart: unless-stopped
    environment:
      <<: *common-env
      WATCHTOWER_CLEANUP: true
      WATCHTOWER_INCLUDE_STOPPED: true
      WATCHTOWER_REVIVE_STOPPED: true
      WATCHTOWER_MONITOR_ONLY: false
      WATCHTOWER_ROLLING_RESTART: true
      WATCHTOWER_SKIP_IMAGE_NAMES: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 10m
###########
# Rancher #
###########
  rancher:
    container_name: rancher-server
    image: rancher/rancher
    volumes:
      - ~/rancher:/var/lib/rancher
    restart: unless-stopped
    ports:
      - "89:80"
      - "446:443"
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    privileged: true
    cpus: 2
    mem_limit: 6g
############
# Postgres #
############
  postgres:
    container_name: postgres
    image: postgres
    network_mode: bridge
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PGDATA: /data/postgres
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    volumes:
      - postgres:/data/postgres
    ports:
      - "6432:5432"
    restart: unless-stopped
###########
# MariaDB #
###########
  mariadb:
    container_name: mariadb
    image: mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: mysql
      MYSQL_USER: mysql
      MYSQL_PASSWORD: mysql
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - "3306:3306"
    volumes:
      - ~/.config/mariadb:/var/lib/mysql
      - ~/.config/mariadb/conf:/etc/mysql/conf.d
#########
# Redis #
#########
  redis:
    container_name: redis
    image: redis
    restart: unless-stopped
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_PORT=6379
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    ports:
      - '6380:6379'
    volumes:
      - 'redis_data:/root/redis'
#################
# HomeAssistant #
#################
  homeassistant:
    container_name: homeassistant
    image: homeassistant/home-assistant:dev
    volumes:
      - ~/.config/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    restart: unless-stopped
    privileged: true
    network_mode: bridge
    ports:
      - 8124:8123
    environment:
      <<: *common-env
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0
############
# Crafty 4 #
############
  crafty:
    container_name: crafty_container
    image: arcadiatechnology/crafty-4:nightly
    restart: always
    environment:
        - TZ=Etc/UTC
    ports:
        - "8445:8443"
        - "8123:8123"
        - "19132:19132/udp"
        - "25500-25600:25500-25600"
    volumes:
        - /mnt/storage/crafty/backups:/crafty/backups
        - /mnt/storage/crafty/logs:/crafty/logs
        - /mnt/storage/crafty/servers:/crafty/servers
        - /mnt/storage/crafty/config:/crafty/app/config
        - /mnt/storage/crafty/import:/crafty/import
###############
# Uptime Kuma #
###############
  uptime-kuma:
    container_name: uptime-kuma
    image: louislam/uptime-kuma:nightly
    volumes:
      -  /mnt/storage/uptime-kuma/data:/app/data
    ports:
      - 3001:3001
    restart: unless-stopped
############
# Scrypted #
############
  scrypted:
    container_name: scrypted
    image: koush/scrypted:full
    environment:
        - SCRYPTED_WEBHOOK_UPDATE_AUTHORIZATION=Bearer token
        - SCRYPTED_WEBHOOK_UPDATE=http://localhost:10444/v1/update
    restart: unless-stopped
    network_mode: host
    devices:
        - /dev/dri:/dev/dri
    volumes:
        - /mnt/storage/scrypted/volume:/server/volume
        - /mnt/storage/scrypted/video:/nvr
    logging:
        driver: "json-file"
        options:
            max-size: "25m"
            max-file: "10"
    labels:
        - "com.centurylinklabs.watchtower.scope=scrypted"
#####################
# Speedtest Tracker #
#####################
  speedtest-tracker:
    image: linuxserver/speedtest-tracker:latest
    container_name: speedtest-tracker
    environment:
      <<: *common-env
      APP_KEY: ""
      APP_URL: ""
      DB_CONNECTION: sqlite
      SPEEDTEST_SCHEDULE: ""
      SPEEDTEST_SERVERS: ""
    volumes:
     - /mnt/storage/speedtest-tracker/config:/config
    ports:
      - 82:80
    restart: unless-stopped
##############
# ZoneMinder #
##############
  zoneminder:
    container_name: zoneminder
    image: zoneminderhq/zoneminder
    restart: unless-stopped
    privileged: false
    shm_size: 5G
    ports:
      - 8444:443/tcp
      - 9111:9000/tcp
    environment:
      <<: *common-env
      INSTALL_HOOK: 0
      INSTALL_FACE: 0
      INSTALL_TINY_YOLOV3: 0
      INSTALL_YOLOV3: 0
      INSTALL_TINY_YOLOV4: 0
      INSTALL_YOLOV4: 0
      MULTI_PORT_START: 0
      MULTI_PORT_END: 0
      ZM_DB_HOST: mysql
      ZM_DB_USER: mysql
      ZM_DB_PASS: mysql
      ZM_DB_NAME: mysql
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    volumes:
      - /mnt/storage/zoneminder/config:/config
      - /mnt/storage/zoneminder/cache:/var/cache/zoneminder
      - /mnt/storage/zoneminder/data:/data
      - /mnt/storage/zoneminder/log:/log
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 1000000000
    depends_on:
      - mariadb
##########
# Webtop #
##########
  webtop:
    image: linuxserver/webtop:latest
    container_name: webtop
    security_opt:
      - seccomp:unconfined
    environment:
      <<: *common-env
      SUBFOLDER: /
      TITLE: Webtop
    volumes:
      - /mnt/storage/webtop/config:/config
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 3005:3000
      - 3006:3001
    devices:
      - /dev/dri:/dev/dri
    shm_size: "1gb"
    restart: unless-stopped
###########
# SearXNG #
###########
  searxng-redis:
    container_name: searxng-redis
    image: valkey/valkey:unstable-alpine
    command: valkey-server --save "" --appendonly no
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - searxng-net
    tmpfs:
      - /data
  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8888:8080"
    volumes:
      - ./config:/etc/searxng:rw
    environment:
      - SEARXNG_SETTINGS_PATH=/etc/searxng/settings.yml
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - searxng-net
    depends_on:
      - searxng-redis
############
# Sickgear #
############
  sickgear:
    image: linuxserver/sickgear:develop
    container_name: sickgear
    environment:
      <<: *common-env
    volumes:
      - /mnt/storage/sickgear/config:/config
      - /mnt/storage/sickgear/tv:/tv
      - /mnt/storage/downloads:/downloads
    ports:
      - 8082:8081
    restart: unless-stopped
#############
# Handbrake #
#############
  handbrake:
    container_name: handbrake
    image: jlesage/handbrake:nightly-latest
    ports:
        - 5800:5800
    devices:
          - /dev/dri:/dev/dri
    volumes:
        - /mnt/storage:/storage:rw
        - /mnt/storage/handbrake/watch:/watch:rw
        - /mnt/storage/handbrake/output:/output:rw
#############
# ARR Stack #
#############
  prowlarr:
    image: linuxserver/prowlarr:nightly
    container_name: prowlarr
    hostname: prowlarr
    environment:
      <<: *common-env
    volumes:
      - /mnt/storage/prowlarr/config:/config
      - /mnt/storage/prowlarr/backup:/data/Backup
      - /mnt/storage/downloads:/downloads
    ports:
      - 9696:9696
    restart: unless-stopped
  sonarr:
    image: linuxserver/sonarr:develop
    container_name: sonarr
    hostname: sonarr
    environment:
      <<: *common-env
    volumes:
      - /mnt/storage/sonarr/config:/config
      - /mnt/storage/sonarr/backup:/data/Backup
      - /mnt/storage/sonarr/tvshows:/data/tvshows
      - /mnt/storage/:/storage/
      - /mnt/storage/Downloads:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped
  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    environment:
      <<: *common-env
    volumes:
      - /mnt/storage/radarr/config:/config
      - /mnt/storage/radarr/movies:/data/movies
      - /mnt/storage/radarr/backup:/data/Backup
      - /mnt/storage/:/storage/
      - /mnt/storage/downloads:/downloads
    ports:
      - 7878:7878
    restart: unless-stopped
  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      <<: *common-env
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_HTML: ${LOG_HTML:-false}
      CAPTCHA_SOLVER: ${CAPTCHA_SOLVER:-none}
    ports:
      - "${PORT:-8191}:8191"
    restart: unless-stopped
  jackett:
    image: linuxserver/jackett:latest
    container_name: jackett
    environment:
      <<: *common-env
    volumes:
      - /mnt/storage/jackett/config:/config
      - /mnt/storage/Downloads:/downloads
    ports:
      - 9117:9117
    restart: unless-stopped

networks:
  searxng-net:
    driver: bridge

volumes:
  cache:
  postgres:
  redis_data:
    driver: local
