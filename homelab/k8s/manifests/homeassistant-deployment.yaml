apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: default
  labels:
    app: homeassistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      containers:
      - name: homeassistant
        image: homeassistant/home-assistant:dev
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        ports:
        - containerPort: 8123
          name: http
        volumeMounts:
        - name: storage-volume
          mountPath: /config
          subPath: homeassistant/config
        - name: localtime
          mountPath: /etc/localtime
        - name: dbus
          mountPath: /run/dbus
        - name: usb-device
          mountPath: /dev/ttyUSB0
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: homelab-storage-pvc
      - name: localtime
        hostPath:
          path: /etc/localtime
      - name: dbus
        hostPath:
          path: /run/dbus
      - name: usb-device
        hostPath:
          path: /dev/ttyUSB0
          type: CharDevice
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: default
spec:
  type: NodePort
  selector:
    app: homeassistant
  ports:
  - port: 8123
    targetPort: 8123
    nodePort: 31123
    name: http