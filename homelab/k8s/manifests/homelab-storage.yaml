apiVersion: v1
kind: PersistentVolume
metadata:
  name: homelab-storage-pv
spec:
  capacity:
    
apiVersion: v1
kind: PersistentVolume
metadata:
  name: homelab-storage-pv
spec:
  capacity:
    storage: 290Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/storage
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homelab-storage-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 250Gi
