apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer
  namespace: default
  labels:
    app: portainer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portainer
  template:
    metadata:
      labels:
        app: portainer
    spec:
      containers:
      - name: portainer-ce
        image: portainer/portainer-ce:sts
        imagePullPolicy: IfNotPresent
        command: ["/portainer", "-H", "tcp://agent:9443", "--tlsskipverify"]
        securityContext:
          privileged: true
        ports:
        - containerPort: 8000
          name: tcp-8000
        - containerPort: 9443
          name: https-9443
        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: storage-volume
          mountPath: /data
          subPath: portainer_data
      - name: agent
        image: portainer/agent:sts
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        ports:
        - containerPort: 9001
          name: agent-port
        volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: docker-volumes
          mountPath: /var/lib/docker/volumes
        - name: host-root
          mountPath: /host
      volumes:
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: docker-volumes
        hostPath:
          path: /var/lib/docker/volumes
          type: Directory
      - name: host-root
        hostPath:
          path: /
          type: Directory
      - name: storage-volume
        persistentVolumeClaim:
          claimName: homelab-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: portainer
  namespace: default
spec:
  type: NodePort
  selector:
    app: portainer
  ports:
  - port: 9443
    targetPort: 9443
    nodePort: 30443
    name: https
  - port: 8000
    targetPort: 8000
    nodePort: 30000
    name: tcp-8000
  - port: 9001
    targetPort: 9001
    nodePort: 30092
    name: agent