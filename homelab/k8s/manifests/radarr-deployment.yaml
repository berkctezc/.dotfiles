apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: default
  labels:
    app: radarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      containers:
      - name: radarr
        image: linuxserver/radarr:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        ports:
        - containerPort: 7878
          name: http
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        volumeMounts:
        - name: storage-volume
          mountPath: /config
          subPath: radarr/config
        - name: storage-volume
          mountPath: /data/movies
          subPath: radarr/movies
        - name: storage-volume
          mountPath: /data/Backup
          subPath: radarr/backup
        - name: storage-volume
          mountPath: /downloads
          subPath: media/downloads
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: homelab-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: default
spec:
  type: NodePort
  selector:
    app: radarr
  ports:
  - port: 7878
    targetPort: 7878
    nodePort: 30078
    name: http