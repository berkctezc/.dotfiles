apiVersion: apps/v1
kind: Deployment
metadata:
  name: scrypted
  namespace: default
  labels:
    app: scrypted
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scrypted
  template:
    metadata:
      labels:
        app: scrypted
    spec:
      hostNetwork: true
      containers:
      - name: scrypted
        image: koush/scrypted:full
        imagePullPolicy: IfNotPresent
        env:
        - name: SCRYPTED_WEBHOOK_UPDATE_AUTHORIZATION
          value: "Bearer token"
        - name: SCRYPTED_WEBHOOK_UPDATE
          value: "http://localhost:10444/v1/update"
        securityContext:
          privileged: true
        volumeMounts:
        - name: storage-volume
          mountPath: /server/volume
          subPath: scrypted/volume
        - name: storage-volume
          mountPath: /nvr
          subPath: scrypted/video
        - name: dri-device
          mountPath: /dev/dri
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: homelab-storage-pvc
      - name: dri-device
        hostPath:
          path: /dev/dri
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: scrypted
  namespace: default
spec:
  type: NodePort
  selector:
    app: scrypted
  ports:
  - port: 10443
    targetPort: 10443
    nodePort: 31043
    name: https