apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: default
  labels:
    app: sonarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
      - name: sonarr
        image: linuxserver/sonarr:develop
        imagePullPolicy: IfNotPresent
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        ports:
        - containerPort: 8989
          name: http
        resources:
          limits:
            cpu: "1"
            memory: 2Gi
          requests:
            cpu: 250m
            memory: 512Mi
        volumeMounts:
        - name: storage-volume
          mountPath: /config
          subPath: sonarr/config
        - name: storage-volume
          mountPath: /data/Backup
          subPath: sonarr/backup
        - name: storage-volume
          mountPath: /data/tvshows
          subPath: sonarr/tvshows
        - name: storage-volume
          mountPath: /downloads
          subPath: media/downloads
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: homelab-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: default
spec:
  type: NodePort
  selector:
    app: sonarr
  ports:
  - port: 8989
    targetPort: 8989
    nodePort: 30089
    name: http