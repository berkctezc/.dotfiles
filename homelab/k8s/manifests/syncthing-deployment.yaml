apiVersion: apps/v1
kind: Deployment
metadata:
  name: syncthing
  namespace: default
  labels:
    app: syncthing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: syncthing
  template:
    metadata:
      labels:
        app: syncthing
    spec:
      hostNetwork: true
      hostname: synct-server
      containers:
      - name: syncthing
        image: syncthing/syncthing:edge
        imagePullPolicy: IfNotPresent
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        volumeMounts:
        - name: storage-volume
          mountPath: /var/syncthing
          subPath: syncthing/var
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: homelab-storage-pvc