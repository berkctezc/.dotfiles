apiVersion: apps/v1
kind: Deployment
metadata:
  name: transmission
  namespace: default
  labels:
    app: transmission
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transmission
  template:
    metadata:
      labels:
        app: transmission
    spec:
      containers:
      - name: transmission
        image: linuxserver/transmission:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        ports:
        - containerPort: 9091
          name: http
        - containerPort: 51413
          name: peer
        - containerPort: 51413
          name: peer-udp
          protocol: UDP
        volumeMounts:
        - name: storage-volume
          mountPath: /config
          subPath: transmission/config
        - name: storage-volume
          mountPath: /downloads
          subPath: media/downloads
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: homelab-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: transmission
  namespace: default
spec:
  type: NodePort
  selector:
    app: transmission
  ports:
  - port: 9091
    targetPort: 9091
    nodePort: 30091
    name: http
  - port: 51413
    targetPort: 51413
    nodePort: 30413
    name: peer
  - port: 51413
    targetPort: 51413
    nodePort: 30414
    protocol: UDP
    name: peer-udp