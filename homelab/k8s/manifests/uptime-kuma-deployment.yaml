apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: default
  labels:
    app: uptime-kuma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      containers:
      - name: uptime-kuma
        image: louislam/uptime-kuma:nightly
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
          name: http
        volumeMounts:
        - name: storage-volume
          mountPath: /app/data
          subPath: uptime-kuma/data
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: homelab-storage-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: default
spec:
  type: NodePort
  selector:
    app: uptime-kuma
  ports:
  - port: 3001
    targetPort: 3001
    nodePort: 31001
    name: http