apiVersion: apps/v1
kind: Deployment
metadata:
  name: webtop
  namespace: default
  labels:
    app: webtop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webtop
  template:
    metadata:
      labels:
        app: webtop
    spec:
      containers:
      - name: webtop
        image: linuxserver/webtop:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          seccompProfile:
            type: Unconfined
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        - name: SUBFOLDER
          value: "/"
        - name: TITLE
          value: Webtop
        ports:
        - containerPort: 3000
          name: http
        - containerPort: 3001
          name: https
        volumeMounts:
        - name: storage-volume
          mountPath: /config
          subPath: webtop/config
        - name: docker-sock
          mountPath: /var/run/docker.sock
        - name: dri-device
          mountPath: /dev/dri
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: homelab-storage-pvc
      - name: docker-sock
        hostPath:
          path: /var/run/docker.sock
          type: Socket
      - name: dri-device
        hostPath:
          path: /dev/dri
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: webtop
  namespace: default
spec:
  type: NodePort
  selector:
    app: webtop
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 31005
    name: http
  - port: 3001
    targetPort: 3001
    nodePort: 31006
    name: https