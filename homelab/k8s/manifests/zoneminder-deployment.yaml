apiVersion: apps/v1
kind: Deployment
metadata:
  name: zoneminder
  namespace: default
  labels:
    app: zoneminder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zoneminder
  template:
    metadata:
      labels:
        app: zoneminder
    spec:
      containers:
      - name: zoneminder
        image: zoneminderhq/zoneminder:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: false
        ports:
        - containerPort: 443
          name: https
        - containerPort: 9000
          name: zm-web
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "Etc/UTC"
        - name: INSTALL_HOOK
          value: "0"
        - name: INSTALL_FACE
          value: "0"
        - name: INSTALL_TINY_YOLOV3
          value: "0"
        - name: INSTALL_YOLOV3
          value: "0"
        - name: INSTALL_TINY_YOLOV4
          value: "0"
        - name: INSTALL_YOLOV4
          value: "0"
        - name: MULTI_PORT_START
          value: "0"
        - name: MULTI_PORT_END
          value: "0"
        - name: ZM_DB_HOST
          value: "mariadb"
        - name: ZM_DB_USER
          value: "mysql"
        - name: ZM_DB_PASS
          value: "mysql"
        - name: ZM_DB_NAME
          value: "mysql"
        resources:
          limits:
            cpu: "2"
            memory: 6Gi
          requests:
            cpu: 500m
            memory: 2Gi
        volumeMounts:
        - name: storage-volume
          mountPath: /config
          subPath: zoneminder/config
        - name: storage-volume
          mountPath: /var/cache/zoneminder
          subPath: zoneminder/cache
        - name: storage-volume
          mountPath: /data
          subPath: zoneminder/data
        - name: storage-volume
          mountPath: /log
          subPath: zoneminder/log
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: storage-volume
        persistentVolumeClaim:
          claimName: homelab-storage-pvc
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: zoneminder
  namespace: default
spec:
  type: NodePort
  selector:
    app: zoneminder
  ports:
  - port: 443
    targetPort: 443
    nodePort: 30444
    name: https
  - port: 9000
    targetPort: 9000
    nodePort: 32000
    name: zm-web